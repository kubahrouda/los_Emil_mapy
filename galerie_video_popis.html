<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie videí se scroll autoplay a popisem</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Georgia", serif;
      line-height: 1.6;
      color: #222;
      background: #eeeeee;
      text-align: center;
    }






    /* --- Galerie videí --- */
    .video-gallery {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      max-width: 900px;
      margin: 0 auto 2rem;
    }

    .main-video {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .main-video video {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .arrow {
      position: absolute;
      background: rgba(255,255,255,0.7);
      border: none;
      font-size: 2rem;
      padding: 0.3rem 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
      border-radius: 50%;
    }

    .arrow:hover {
      background: rgba(255,255,255,0.95);
    }

    .arrow.left { left: 1rem; }
    .arrow.right { right: 1rem; }

    .thumbnails {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .thumbnails video {
      cursor: pointer;
      border-radius: 6px;
      opacity: 0.6;
      transition: opacity 0.3s, transform 0.2s;
      width: 120px;
      height: 80px;
      object-fit: cover;
    }

    .thumbnails video:hover {
      opacity: 1;
      transform: scale(1.05);
    }

    .thumbnails video.active {
      opacity: 1;
      border: 2px solid #d4c8b0;
    }

    .video-description {
      font-size: 1rem;
      color: #333;
      margin-top: 0.5rem;
      max-width: 800px;
      line-height: 1.5;
      padding: 0 1rem;
    }
  </style>
</head>
<body>

  <div class="video-gallery" id="videoGallery">
    <div class="main-video">
      <button class="arrow left" onclick="changeVideo(-1)">&#10094;</button>
      <video id="gallery-main" preload="none" playsinline muted>
        <source src="Volec.mp4" type="video/mp4">
        Váš prohlížeč nepodporuje přehrávání videa.
      </video>
      <button class="arrow right" onclick="changeVideo(1)">&#10095;</button>
    </div>

    <div class="thumbnails">
      <video src="Volec.mp4" onclick="showVideo(0)" class="active"></video>
      <video src="Kletne.mp4" onclick="showVideo(1)"></video>
      <video src="Cholupice.mp4" onclick="showVideo(2)"></video>
      <video src="terezcin_hajek.mp4" onclick="showVideo(3)"></video>
    </div>

    <div class="video-description" id="videoDescription">
      <strong>Ekodukt Voleč</strong> (okres Pardubice) propojuje lesní komplex - i za jeho hranicí nenaráží zvířata na zásadní bariéru. Samotná konstrukce je pak z obou stran dostatečně kryta křovím, a ačkoliv po ní vede i lesní cesta, není příliš frekventovaná.
    </div>
  </div>

  <script>
    const videos = [
      "Volec.mp4",
      "Kletne.mp4",
      "Cholupice.mp4",
      "terezcin_hajek.mp4"
    ];

    const descriptions = [
      "<strong>Ekodukt Voleč</strong> (okres Pardubice) propojuje lesní komplex - i za jeho hranicí nenaráží zvířata na zásadní bariéru. Samotná konstrukce je pak z obou stran dostatečně kryta křovím, a ačkoliv po ní vede i lesní cesta, není příliš frekventovaná.",
      "<strong>Ekodukt Kletné</strong> (okres Nový Jičín) sice stojí mezi poly, není ale příliš využíván pro přesuny zemědělské techniky. Jeho průchodnost by mohl zajistit zarůstající biokoridor vedoucí z obou stran - i ten však po sta metrech končí v polích a nenavazuje tak na blízkou CHKO Poodří.",
      "<strong>Série ekoduktů Cholupice</strong> (Praha) je příkladem mnoha častých problémů - všechny tři ekodukty jsou pro efektivní využití divokými zvířaty příliš úzké, problematická je také přítomnost polních/asfaltových cest a s ní související automobilový provoz. Žádný z ekoduktů nepropojuje významné krajinné celky (z obou stran je obklopují pole a zástavba). Blízkou Modřanskou rokli s údolím Vltavy navíc mnohem lépe spojuje plocha nad Komořanským tunelem.",
      "<strong>Ekodukt Terezčin hájek</strong> (okres Tábor) sice propojuje dva lesní celky, lepší efektivitě však bráni blízkost Sezimova Ústí a široká asfaltová silnice, zabírající velkou část jeho plochy."
    ];

    let currentIndex = 0;
    const mainVideo = document.getElementById("gallery-main");
    const thumbs = document.querySelectorAll(".thumbnails video");
    const desc = document.getElementById("videoDescription");

    function showVideo(index) {
      mainVideo.pause();
      currentIndex = index;
      mainVideo.src = videos[index];
      thumbs.forEach(v => v.classList.remove("active"));
      thumbs[index].classList.add("active");
      desc.innerHTML = descriptions[index];
      mainVideo.play();
    }

    function changeVideo(direction) {
      currentIndex += direction;
      if (currentIndex < 0) currentIndex = videos.length - 1;
      if (currentIndex >= videos.length) currentIndex = 0;
      showVideo(currentIndex);
    }

    // Autoplay při scrollu – pouze pro první video
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting && currentIndex === 0) {
          mainVideo.play();
        } else if (!entry.isIntersecting && currentIndex === 0) {
          mainVideo.pause();
        }
      });
    }, { threshold: 0.5 });

    observer.observe(mainVideo);
  </script>

</body>
</html>
